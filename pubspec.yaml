name: fftcg_companion
description: A Final Fantasy TCG companion app for card management and collection tracking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_analytics: ^12.0.4
  firebase_crashlytics: ^5.0.5
  firebase_app_check: ^0.4.1+2
  firebase_storage: ^13.0.4

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  state_notifier: ^1.0.0

  # Routing
  go_router: ^17.0.0

  # Local Storage
  hive_ce: ^2.15.1
  hive_ce_flutter: ^2.3.3

  # Authentication
  google_sign_in: ^7.2.0

  # UI Components
  flex_color_scheme: ^8.1.1
  flex_color_picker: ^3.7.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  fl_chart: ^1.1.1
  flutter_native_splash: ^2.4.5

  # Utils
  dart_mappable: ^4.2.1 # Added
  intl: ^0.20.2
  collection: ^1.19.1
  talker: ^5.1.2
  talker_flutter: ^5.1.2
  talker_riverpod_logger: ^5.1.2
  url_launcher: ^6.3.1
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  package_info_plus: ^9.0.0
  device_info_plus: ^12.3.0
  image_picker: ^1.1.2
  csv: ^6.0.0
  google_fonts: ^6.2.1
  crypto: ^3.0.6
  flutter_html: ^3.0.0
  connectivity_plus: ^7.0.0
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.15
  custom_lint: ^0.8.1
  dart_mappable_builder: ^4.2.1 # Added
  riverpod_generator: ^3.0.3
  riverpod_lint: ^3.0.3

  # Testing
  mocktail: ^1.0.4

  # Development Tools
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/elements/
    - assets/images/description/
    - assets/images/google_branding/
    - assets/images/google_branding/signin-assets/

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/images/logo_transparent_black.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  color: "#000000"
  image: assets/images/logo_transparent_splash.png
  color_dark: "#000000"
  image_dark: assets/images/logo_transparent_splash.png
  android_12:
    # For Android 12, we're using the approach without an icon background
    # The image should be 1152×1152 pixels, and fit within a circle 768 pixels in diameter
    color: "#000000"
    image: assets/images/logo_transparent_splash.png
    color_dark: "#000000"
    image_dark: assets/images/logo_transparent_splash.png
  ios: true
  web: false
  android: true
  fullscreen: false
  android_gravity: center
  ios_content_mode: center
